##
## Liquibase Flow File — chains commands into a reusable pipeline.
## Run: liquibase flow --flow-file=liquibase.flowfile.yaml
## Covered in Week 4, Day 6 notes.
##

stages:
  validate:
    actions:
      - type: liquibase
        command: validate
      - type: liquibase
        command: status
        cmdArgs:
          verbose: true

  preview:
    actions:
      - type: liquibase
        command: futureRollbackSQL
      - type: liquibase
        command: updateSQL

  deploy:
    actions:
      - type: liquibase
        command: tag
        cmdArgs: { tag: "pre-deploy-${DEPLOY_ID:local}" }
      - type: liquibase
        command: update
        cmdArgs:
          contexts: ${CONTEXTS:dev}
